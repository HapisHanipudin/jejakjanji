name: Build preview bundle

on:
  push:
    branches: [feat/multi-daerah-local]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/preview-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/web build:cloudflare
        env:
          API_BASE_URL: https://jejakjanji-api-preview.hapishanipudin.workers.dev
      - run: tar -czf preview-open-next.tar.gz -C apps/web .open-next
      - uses: actions/upload-artifact@v4
        with:
          name: preview-open-next
          path: preview-open-next.tar.gz
          retention-days: 3
