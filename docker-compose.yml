services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: jejakjanji
      POSTGRES_PASSWORD: jejakjanji
      POSTGRES_DB: jejakjanji
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jejakjanji']
      interval: 2s
      retries: 15
volumes:
  pgdata:
